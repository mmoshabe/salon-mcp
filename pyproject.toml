[project]
name = "salon-mcp"
version = "0.1.0"
description = "MCP server giving Claude safe, audited access to a salon's bookings: look up and propose, never act."
readme = "README.md"
authors = [
    { name = "mmoshabe", email = "49338520+mmoshabe@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
salon-mcp = "salon_mcp.server:main"
salon-admin = "salon_mcp.admin:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
